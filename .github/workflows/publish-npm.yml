name: Publish to NPM

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish-and-sync:
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'changeset-release/')
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reusable Setup
        uses: ./.github/actions/setup
        with:
          bun_version: "latest"

      - name: Publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Get Package Name and Version
        id: get_version
        run: |
          PACKAGE_NAME=$(bun -e 'console.log(require("./packages/devkit/package.json").name)')
          VERSION=$(bun -e 'console.log(require("./packages/devkit/package.json").version)')
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔄 Sync changes to temporary branch
        run: |
          git fetch origin main:main
          git checkout -b auto-gen-sync-develop-to-main
          git merge develop --no-ff -m "chore(release): merge develop changes for ${{ steps.get_version.outputs.PACKAGE_NAME }}@${{ steps.get_version.outputs.VERSION }}"

      - name: 🚀 Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): update main with the new release ${{ steps.get_version.outputs.PACKAGE_NAME }}@${{ steps.get_version.outputs.VERSION }}"
          title: "Release: update the `main` branch with new release ${{ steps.get_version.outputs.PACKAGE_NAME }}@${{ steps.get_version.outputs.VERSION }}"
          body: |
            This PR was automatically created to sync the `main` branch with the latest changes in `develop` after a successful package publish.

            Package: ${{ steps.get_version.outputs.PACKAGE_NAME }}
            Version: ${{ steps.get_version.outputs.VERSION }}
          base: "main"
          branch: "auto-gen-sync-develop-to-main"
          delete-branch: true

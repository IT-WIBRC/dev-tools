name: Release PR

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Reusable Setup
        uses: ./.github/actions/setup
        with:
          bun_version: "latest"

      - name: 🚀 Validate Git Status
        run: |
          git fetch
          if [ "$(git rev-list --count @{u}..HEAD)" -ne 0 ] || [ "$(git rev-list --count HEAD..@{u})" -ne 0 ]; then
            echo "❌ Your branch is out of sync with remote. Please pull or push before running this workflow."
            exit 1
          fi

      - name: Create Release Pull Request (Update Files Only)
        id: changeset_version
        uses: changesets/action@v1
        with:
          version: bun run version
          commit: "chore(release): scaffolder-toolkit@version"
          title: "chore(release): scaffolder-toolkit@version"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY_SKIP_HOOKS: 1
